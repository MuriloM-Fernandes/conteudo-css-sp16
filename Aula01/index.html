<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula01 - CSS</title>

    <style>
        h4.centralizado {
            text-align: center;
            color: crimson;
        }

        * {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            
        }
    </style>
</head>
<body>
    
    <h1>Introdução ao CSS</h1>

    <h3 style="font-family: sans-serif; background-color: yellowgreen;">Exemplo simples de CSS</h3>

    <p style="font-family: monospace; background-color: coral;">Eu sou uma Girafa</p>

    <p style="font-family: monospace; background-color: coral;">Eu sou uma Girafa</p>

    <hr>

    <h3>Exemplo de estilo em um elemento que faz parte de uma classe</h3>

    <h4 class="centralizado">Eu sou um tigre</h4>

    <p class="centralizado">Eu sou uma Girafa</p>

    <hr>

    <h3>Definindo estilos com o seletor global *</h3>

    <p>todos os elementos textuais terão a mesma fonte, inclusive no mesmo parágrafo.</p>


</body>
</html>
